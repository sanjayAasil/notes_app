name: keep_notes
description: "Keep Notes"
publish_to: 'none'

version: 2.0.2+8

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  awesome_notifications_core: ^0.10.1
  awesome_notifications: ^0.10.1
  cupertino_icons: ^1.0.2
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.2
  versatile_dialogs: ^0.0.4
  http: ^1.2.1
  cached_network_image: ^3.4.1
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/notes_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/notes_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/notes_logo.png
